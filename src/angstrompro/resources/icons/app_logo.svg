<svg xmlns="http://www.w3.org/2000/svg"
     width="400"
     height="400"
     viewBox="0 0 400 400"
     role="img"
     aria-labelledby="title desc">
  <title id="title">AngstromPro app logo</title>
  <desc id="desc">Hand-drawn teal Angstrom symbol on a rounded white app tile.</desc>

  <!-- White app-icon tile for consistent contrast in light and dark UI. -->
  <rect x="12"
        y="12"
        width="376"
        height="376"
        rx="42"
        fill="#FFFFFF"
        stroke="#D6DCE1"
        stroke-width="6"/>

  <!-- Give the hand-drawn mark comfortable padding inside the tile. -->
  <g transform="translate(12 26) scale(.86)">
  <g fill="none"
     stroke="#0788A3"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Ring above the Angstrom mark. -->
    <path d="M229 26
             C244 32 248 46 244 59
             C240 73 225 79 211 76
             C195 73 188 61 190 47
             C192 32 205 23 218 24
             C222 24 226 25 229 26 Z"
          stroke-width="24"/>

    <!-- Left rising stroke and its returning inner stroke preserve the
         open, hand-drawn loop from the source sketch. -->
    <path d="M218 108
             C196 127 178 173 163 222
             C151 261 143 300 142 328"
          stroke-width="24"/>
    <path d="M218 108
             C211 137 199 174 184 214
             C167 260 151 301 142 328"
          stroke-width="14"/>

    <!-- Long right leg and lower return. -->
    <path d="M218 108
             C242 124 249 174 257 226
             C266 284 274 335 270 354
             C268 369 257 372 242 366
             C224 359 204 346 187 330"
          stroke-width="22"/>
  </g>

  <!-- Broad cross stroke, drawn as a filled brush shape so it retains the
       tapered left edge and heavier right end of the sketch. -->
  <path d="M84 254
           C123 239 164 229 207 220
           C236 214 260 208 279 208
           C288 208 293 212 293 218
           C293 225 286 230 278 231
           C252 232 226 235 199 239
           C155 245 116 252 84 258
           C80 259 78 258 78 257
           C78 256 80 255 84 254 Z"
        fill="#0788A3"
        stroke="#0788A3"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  </g>
</svg>
